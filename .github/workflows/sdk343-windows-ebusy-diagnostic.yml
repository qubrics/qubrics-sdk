name: SDK343 Windows EBUSY diagnostic

on:
  push:
    branches:
      - agent/rebrand-qubrics-sdk343-windows-ebusy

permissions:
  contents: read

jobs:
  fixture-lock:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.22.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.13.0
      - run: pnpm install --frozen-lockfile
      - name: Install official Sysinternals Handle
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sdk343-handle.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'sdk343-handle'
          Invoke-WebRequest https://download.sysinternals.com/files/Handle.zip -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          "SDK343_HANDLE64=$(Join-Path $directory 'handle64.exe')" >> $env:GITHUB_ENV
      - run: pnpm -r --if-present build
      - run: pnpm verify:ts-public-api
      - run: pnpm verify:tree-shaking
      - run: pnpm test:ts-helpers
      - run: pnpm test:connections
      - run: pnpm test:windows-command-shims
      - run: pnpm check:cli
      - name: Diagnose actual Windows consumer ownership
        run: node scripts/diagnose-windows-consumer-ownership.mjs .tmp/windows-consumer-ownership
      - name: Run sensitivity once and capture first fixture EBUSY
        run: node scripts/test-windows-consumer-sensitivity.mjs
