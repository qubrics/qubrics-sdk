name: Deploy Fly app

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full Git commit SHA of the release to deploy
        required: true
        type: string
      rollback_image:
        description: Immutable image digest (sha256:…) from that release, for rollback only
        required: false
        type: string
      expected_expiry:
        description: Expected Fly token expiry as Unix seconds
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fly-deploy-token-proof-${{ inputs.rollback_image != '' && 'retirement' || 'readback' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER }}
    timeout-minutes: 20
    steps:
      - name: Validate release inputs
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
        run: |
          if [[ ! "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Enter a full, lowercase Git commit SHA.' >&2
            exit 1
          fi
          if [[ -n "$ROLLBACK_IMAGE" && ! "$ROLLBACK_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Enter the SHA-256 digest of the previous release image.' >&2
            exit 1
          fi

      - name: Check out deploy commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.5.12

      - name: Read back the Actions deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_EXPIRY: ${{ inputs.expected_expiry }}
        run: |
          set -o pipefail
          expiry=$(flyctl tokens debug 2>/dev/null | jq -er '[.[].caveats[] | select(.type == "ValidityWindow") | .body.not_after] | min // empty')
          if [[ "$expiry" != "$EXPECTED_EXPIRY" ]]; then
            echo 'The stored token did not match the expected expiry.' >&2
            exit 1
          fi
          flyctl machine list --app qubrics-mcp-pilot >/dev/null
          date -u '+Deploy credential read back and authenticated at %Y-%m-%dT%H:%M:%SZ.'

      - name: Verify the captured token cannot deploy after revocation
        if: inputs.rollback_image != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
        run: |
          auth_error='(^|[^[:digit:]])(401|403)([^[:digit:]]|$)|not authorized|unauthori[sz]ed|unauthenticated|authentication|invalid token|revoked token'
          for attempt in {1..144}; do
            if listing=$(flyctl machine list --app qubrics-mcp-pilot 2>&1); then
              sleep 5
            elif grep -Eiq "$auth_error" <<< "$listing"; then
              if deployment=$(flyctl deploy --rollback --image "registry.fly.io/qubrics-mcp-pilot@$ROLLBACK_IMAGE" 2>&1); then
                echo 'The captured token still enabled a deploy.' >&2
                exit 1
              fi
              if ! grep -Eiq "$auth_error" <<< "$deployment"; then
                echo 'The deploy failed without an authentication rejection.' >&2
                exit 1
              fi
              date -u '+Fly rejected the deployment with the revoked credential at %Y-%m-%dT%H:%M:%SZ.'
              exit 0
            else
              echo 'The token check failed without an authentication rejection.' >&2
              exit 1
            fi
          done
          echo 'The captured token still authenticates.' >&2
          exit 1
