name: Publish frozen sendmux 1.0.0

on:
  pull_request:
    paths:
      - .github/workflows/publish-sendmux-crate.yml
      - scripts/publish-frozen-sendmux.py
      - scripts/publish-frozen-sendmux.test.py
      - release-pointers/cratesio/sendmux/sendmux-1.0.0.crate
  workflow_dispatch:
    inputs:
      approved_sha256:
        description: Paste the operator-approved sendmux 1.0.0 archive SHA-256.
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-frozen-sendmux-1.0.0
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Verify exact bytes and changed-file rejection offline
        run: python3 scripts/publish-frozen-sendmux.test.py
      - name: Inspect the frozen upload without publishing
        run: python3 scripts/publish-frozen-sendmux.py

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main and the exact operator-approved hash
        env:
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$APPROVED_SHA256" = 0382c47cd5ae1b8afa20ecd59cf8e5218424f80786429603535a73b1d8dad802
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact approved crate source for its guard
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 12d4901d1edd5a767a97f99db49aafbe701c06c4
          fetch-depth: 0
          persist-credentials: false
          path: .approved-source
      - name: Prepare default skill compatibility checks
        uses: ./.github/actions/skill-release-checks
      - name: Guard the exact approved source
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publication-guard.mjs candidate --repo .approved-source --sha 12d4901d1edd5a767a97f99db49aafbe701c06c4
      - name: Authenticate with the configured crates.io trusted publisher
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Upload only the frozen crate without rebuilding
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish-frozen-sendmux.py --publish
