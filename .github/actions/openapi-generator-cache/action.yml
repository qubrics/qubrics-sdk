name: Verified OpenAPI Generator cache
description: Seed once or install the versioned JAR after verifying Maven's published SHA1.
inputs:
  seed:
    description: Allow the single preparation job to download and save a cache miss.
    default: "false"
runs:
  using: composite
  steps:
    - name: Read generator version
      id: generator
      shell: bash
      run: echo "version=$(node scripts/prepare-openapi-generator-cache.mjs version)" >> "$GITHUB_OUTPUT"
    - name: Restore exact generator cache
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tmp/openapi-generator-cache
        key: openapi-generator-${{ steps.generator.outputs.version }}-${{ hashFiles('codegen/openapi-generator.sha1') }}
        fail-on-cache-miss: ${{ inputs.seed != 'true' }}
    - name: Verify and prepare generator
      shell: bash
      env:
        GENERATOR_CACHE_COMMAND: ${{ inputs.seed == 'true' && 'seed' || 'install' }}
      run: node scripts/prepare-openapi-generator-cache.mjs "$GENERATOR_CACHE_COMMAND"
    - name: Save verified generator cache
      if: inputs.seed == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tmp/openapi-generator-cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
