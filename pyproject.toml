[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/packages/python/core",
  "$MYPY_CONFIG_FILE_DIR/packages/python/sending",
  "$MYPY_CONFIG_FILE_DIR/packages/python/mailbox",
  "$MYPY_CONFIG_FILE_DIR/packages/python/management",
  "$MYPY_CONFIG_FILE_DIR/packages/python/sdk",
  "$MYPY_CONFIG_FILE_DIR/packages/python/mcp",
  "$MYPY_CONFIG_FILE_DIR/packages/python/langchain",
]
exclude = [
  "packages/python/.*/qubrics/.*/api/.*",
  "packages/python/.*/qubrics/.*/models/.*",
  "packages/python/.*/qubrics/.*/api_client.py",
  "packages/python/.*/qubrics/.*/api_response.py",
  "packages/python/.*/qubrics/.*/configuration.py",
  "packages/python/.*/qubrics/.*/exceptions.py",
  "packages/python/.*/qubrics/.*/rest.py",
]

[[tool.mypy.overrides]]
module = [
  "qubrics.sending.*",
  "qubrics.mailbox.*",
  "qubrics.management.*",
  "fastmcp.*",
  "posthog.*",
  "starlette.*",
]
ignore_missing_imports = true

# langchain-qubrics installs langchain-core (and its transitive langsmith) into
# the check-python venv so the toolkit tests can import it. Do not follow mypy
# into those third-party trees: mypy crashes on langsmith's generated openapi
# client, and the toolkit is fully checked against the generated sendmux models
# regardless. Treat them as Any.
[[tool.mypy.overrides]]
module = [
  "langchain_core.*",
  "langchain.*",
  "langsmith.*",
]
follow_imports = "skip"
ignore_missing_imports = true
