[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sendmux-mailbox"
version = "3.0.0"
description = "Deprecated: use qubrics-mailbox."
readme = { text = "sendmux-mailbox is deprecated. Install qubrics-mailbox and import from qubrics.", content-type = "text/plain" }
requires-python = ">=3.10"
license = "MIT"
classifiers = ["Development Status :: 7 - Inactive"]
dependencies = ["qubrics-mailbox>=3.0.0,<4.0.0"]

[project.urls]
Repository = "https://github.com/qubrics/qubrics-sdk"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
bypass-selection = true
