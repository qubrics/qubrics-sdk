[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sendmux-mcp"
version = "3.0.0"
description = "Dependency-only package."
readme = { text = "Installs the required dependency.", content-type = "text/plain" }
requires-python = ">=3.10"
license = "MIT"
classifiers = ["Development Status :: 7 - Inactive"]
dependencies = ["qubrics-mcp>=3.0.0,<4.0.0"]

[project.scripts]
sendmux-mcp = "qubrics.mcp.cli:main"
sendmux-mcp-hosted = "qubrics.mcp.hosted:run_hosted"
sendmux-mcp-mailbox = "qubrics.mcp.cli:main_mailbox"
sendmux-mcp-management = "qubrics.mcp.cli:main_management"
sendmux-mcp-sending = "qubrics.mcp.cli:main_sending"

[project.urls]
Repository = "https://github.com/qubrics/qubrics-sdk"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
bypass-selection = true
