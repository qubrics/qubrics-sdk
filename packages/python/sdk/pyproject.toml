[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qubrics-sdk"
version = "3.0.1"
description = "Umbrella package for the Qubrics Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "qubrics-core>=2.0.0,<3.0.0",
  "qubrics-mailbox>=2.0.2,<3.0.0",
  "qubrics-management>=2.0.1,<3.0.0",
  "qubrics-sending>=1.6.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/qubrics/qubrics-sdk"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["qubrics"]
