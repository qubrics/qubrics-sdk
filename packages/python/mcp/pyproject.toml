[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qubrics-mcp"
version = "2.2.0"
description = "Email inbox API and outbound sending tools for AI Agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "anyio>=4.9,<5",
  "fastmcp==4.0.3",
  "httpx>=0.28.1,<1",
  "httpx2>=2.5,<3",
  "jsonschema>=4.20,<5",
  "mcp==2.2.0",
  "posthog>=7.21.0,<8",
  "qubrics-core>=2.0.0,<3.0.0",
]

[project.scripts]
qubrics-mcp = "qubrics.mcp.cli:main"
qubrics-mcp-hosted = "qubrics.mcp.hosted:run_hosted"
qubrics-mcp-mailbox = "qubrics.mcp.cli:main_mailbox"
qubrics-mcp-management = "qubrics.mcp.cli:main_management"
qubrics-mcp-sending = "qubrics.mcp.cli:main_sending"

[project.urls]
Repository = "https://github.com/qubrics/qubrics-sdk"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "LICENSE",
  "README.md",
  "evals.xml",
  "qubrics",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["qubrics"]
artifacts = ["qubrics/mcp/openapi/*.json"]
