[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-qubrics"
version = "0.4.0"
description = "LangChain toolkit for the Qubrics email API for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
  "sendmux",
  "email",
  "email-api",
  "ai-agents",
  "agent",
  "agents",
  "langchain",
  "langchain-toolkit",
  "tools",
  "inbox",
  "mailbox",
  "send-email",
  "transactional-email",
  "llm",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "langchain-core>=1.0.0,<2",
  "qubrics-sending>=2.0.0,<3.0.0",
  "qubrics-mailbox>=2.0.2,<3.0.0",
]

[project.urls]
Homepage = "https://qubrics.com"
Documentation = "https://qubrics.com/docs/sdks"
Repository = "https://github.com/qubrics/qubrics-sdk"
Issues = "https://github.com/qubrics/qubrics-sdk/issues"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "LICENSE",
  "README.md",
  "qubrics",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["qubrics"]
artifacts = ["qubrics/langchain/py.typed"]
