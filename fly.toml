app = "qubrics-mcp-pilot"
primary_region = "fra"

[build]
  dockerfile = "packages/python/mcp/Dockerfile"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8765
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    grace_period = "10s"
    interval = "15s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
